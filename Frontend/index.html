<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCLU Tabulation System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <i>Home</i>
        <i>Scoreboard</i>
        <i>Accomplishments</i>
        <i>CIT Mission & Vision</i>
    </header>
    <main class="container-main">
        <section class="controls">
            <h2>Manage Contestants</h2>
            <form id="add-contestant-form">
                <input id="contestant-name" placeholder="Contestant name" required />
                <button type="submit">Add Contestant</button>
            </form>

            <h2>Submit Score</h2>
            <form id="submit-score-form">
                <select id="contestant-select"></select>
                <input id="judge-name" placeholder="Judge name (optional)" />
                <input id="score-value" type="number" step="0.01" placeholder="Score" required />
                <button type="submit">Submit Score</button>
            </form>
        </section>

        <section class="scoreboard">
            <h2>Scoreboard</h2>
            <div id="scoreboard-list"></div>
        </section>
    </main>
    <script src="index.js"></script>
</body>
</html>
